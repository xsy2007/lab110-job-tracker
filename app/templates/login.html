{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h2>登录</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="form" style="flex-direction:column;align-items:stretch;">
    <input name="username" placeholder="用户名" required autofocus>
    <input name="password" type="password" placeholder="密码" required>
    <button type="submit" class="btn btn-primary">登录</button>
  </form>
  <p class="muted small">预置账号：user1 / user2 / maintainer（密码与用户名相同）</p>
</div>
{% endblock %}
