{% extends "base.html" %}
{% block title %}关注{% endblock %}
{% block content %}
<h2>关注的岗位</h2>
<table>
  <tr><th>标题</th><th>公司</th><th>城市</th><th>状态</th><th>操作</th></tr>
  {% for j in jobs %}
  <tr>
    <td><a href="/jobs/{{ j.id }}">{{ j.title }}</a></td>
    <td>{{ j.company }}</td>
    <td>{{ j.city }}</td>
    <td>{{ j.status }}</td>
    <td><form method="post" action="/jobs/{{ j.id }}/unfollow" style="display:inline"><button type="submit">取消关注</button></form></td>
  </tr>
  {% else %}
  <tr><td colspan="5">暂无关注</td></tr>
  {% endfor %}
</table>
{% endblock %}
