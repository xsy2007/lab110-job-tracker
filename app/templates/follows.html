{% extends "base.html" %}
{% block title %}关注{% endblock %}
{% block content %}
<h1>关注的岗位</h1>
{% if jobs %}
<div style="overflow-x:auto;">
<table class="table">
  <thead><tr><th>标题</th><th>公司</th><th>城市</th><th>状态</th><th>操作</th></tr></thead>
  <tbody>
  {% for j in jobs %}
  <tr>
    <td><a href="/jobs/{{ j.id }}">{{ j.title }}</a></td>
    <td>{{ j.company }}</td>
    <td>{{ j.city }}</td>
    <td><span class="badge {{ j.status | badge }}">{{ j.status }}</span></td>
    <td><form method="post" action="/jobs/{{ j.id }}/unfollow" class="inline-form"><button class="btn btn-sm btn-danger">取消关注</button></form></td>
  </tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% else %}
<div class="empty">暂无关注</div>
{% endif %}
{% endblock %}
