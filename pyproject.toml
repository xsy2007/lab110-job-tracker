[project]
name = "lab110-job-tracker"
version = "0.1.0"
description = "Job tracker for 110 Lab recruitment assessment"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "sqlalchemy",
    "httpx",
    "beautifulsoup4",
    "python-multipart",
    "itsdangerous",
    "python-dotenv",
    "quickjs",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-httpx",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
